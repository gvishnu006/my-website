<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Nova Studio</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="index.html">Nova<span>Studio</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <h1>Get in touch</h1>
    <p>Have a project in mind? Drop us a line and we'll get back within one business day.</p>

    <form class="form" id="contactForm" novalidate>
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us about your project..." required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Send message</button>
      <p class="form-status" id="formStatus" role="status"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Nova Studio. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
